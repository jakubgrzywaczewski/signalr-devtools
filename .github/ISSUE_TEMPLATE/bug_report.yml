name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior without including sensitive payloads.
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: SignalR transport
      options:
        - WebSockets
        - Server-Sent Events
        - Long Polling
        - Unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
