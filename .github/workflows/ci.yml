name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: signalr-inspector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: signalr-inspector/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify version consistency
        run: npm run version:check
      - name: Check extension
        run: npm run check
      - name: Run tests with coverage thresholds
        run: npm run test:coverage
      - name: Verify public analysis package
        run: npm run analysis:check
      - name: Verify tag matches extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Package extension
        run: npm run package
      - name: Verify release archive
        run: |
          test "$(unzip -Z1 ../dist/signalr-inspector.zip | grep -c '^manifest.json$')" -eq 1
          test "$(unzip -Z1 ../dist/signalr-inspector.zip | grep -c '^tests/')" -eq 0
          test "$(unzip -Z1 ../dist/signalr-inspector.zip | grep -c '^node_modules/')" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signalr-inspector-extension
          path: dist/signalr-inspector.zip
          if-no-files-found: error

  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore sample
        run: dotnet restore samples/SignalR.Sample
      - name: Build sample
        run: dotnet build samples/SignalR.Sample --configuration Release --no-restore
      - name: Restore MessagePack fixture generator
        run: dotnet restore tools/msgpack-fixtures
      - name: Build MessagePack fixture generator
        run: dotnet build tools/msgpack-fixtures --configuration Release --no-restore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: signalr-inspector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: signalr-inspector/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('signalr-inspector/package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build sample before the web server window
        run: dotnet build ../samples/SignalR.Sample --configuration Release
      - name: Build stateful reconnect fixture before the web server window
        run: dotnet build tests/e2e/fixtures/stateful-app --configuration Release
      - name: Run extension end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: signalr-inspector/coverage/playwright
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, sample, e2e, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signalr-inspector-extension
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/signalr-inspector.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/signalr-inspector.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "SignalR Inspector $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
