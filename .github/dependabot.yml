version: 2
updates:
  - package-ecosystem: npm
    directory: /signalr-inspector
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    groups:
      development-dependencies:
        dependency-type: development
        patterns:
          - "*"
    ignore:
      # 2.5.14 reports noUnnecessaryConditions on RegExp.exec() null checks
      # (biomejs/biome#11278, fixed in 2.5.15). 2.5.15 panics with "path is
      # expected to be under the root" when linting a file outside the project,
      # which breaks tests/extensionSecurity.test.mjs (biomejs/biome#12158, fixed
      # after 2.5.15). Drop this entry once the next Biome release lands.
      - dependency-name: "@biomejs/biome"
        versions: ["2.5.14", "2.5.15"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
