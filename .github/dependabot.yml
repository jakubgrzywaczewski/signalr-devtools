version: 2
updates:
  - package-ecosystem: npm
    directory: /signalr-inspector
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    groups:
      development-dependencies:
        dependency-type: development
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
