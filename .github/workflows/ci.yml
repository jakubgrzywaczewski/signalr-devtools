name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: signalr-inspector
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: signalr-inspector/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify version consistency
        run: npm run version:check
      - name: Check extension
        run: npm run check
      - name: Run tests with coverage thresholds
        run: npm run test:coverage
      - name: Verify tag matches extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Package extension
        run: npm run package
      - name: Verify release archive
        run: |
          test "$(unzip -Z1 ../dist/signalr-inspector.zip | grep -c '^manifest.json$')" -eq 1
          test "$(unzip -Z1 ../dist/signalr-inspector.zip | grep -c '^tests/')" -eq 0
          test "$(unzip -Z1 ../dist/signalr-inspector.zip | grep -c '^node_modules/')" -eq 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signalr-inspector-extension
          path: dist/signalr-inspector.zip
          if-no-files-found: error

  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore sample
        run: dotnet restore samples/SignalR.Sample
      - name: Build sample
        run: dotnet build samples/SignalR.Sample --configuration Release --no-restore
      - name: Restore MessagePack fixture generator
        run: dotnet restore tools/msgpack-fixtures
      - name: Build MessagePack fixture generator
        run: dotnet build tools/msgpack-fixtures --configuration Release --no-restore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, sample, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signalr-inspector-extension
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/signalr-inspector.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/signalr-inspector.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "SignalR Inspector $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
