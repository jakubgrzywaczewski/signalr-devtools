version: 2
updates:
  - package-ecosystem: npm
    directory: /signalr-inspector
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    groups:
      development-dependencies:
        dependency-type: development
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: nuget
    directories:
      - /samples/SignalR.Sample
      - /tools/msgpack-fixtures
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    groups:
      signalr:
        patterns:
          - "Microsoft.AspNetCore.SignalR.*"
    ignore:
      # Keep the protocol packages aligned with the fixtures' net10.0 target.
      # Revisit major updates when the fixtures move to a newer .NET runtime.
      - dependency-name: "Microsoft.AspNetCore.SignalR.*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
